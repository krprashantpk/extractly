[project]
name = "extractly"
version = "0.1.0"
description = "Evidence-preserving evaluation for Azure Content Understanding extraction."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["extraction", "evaluation", "content-understanding", "foundry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "azure-ai-evaluation>=1.18.9,<2",
    "pydantic>=2.12,<3",
]

[build-system]
requires = ["uv_build>=0.10.5,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = ["sdk: exercises the real Foundry SDK locally without model calls"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RET", "SIM", "PTH", "RUF"]
ignore = ["E501", "S101"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["azure.ai.evaluation.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "mypy>=1.19,<2",
    "pytest>=8,<10",
    "pytest-mock>=3.14,<4",
    "ruff>=0.15,<1",
    "tqdm>=4.70.1",
]
